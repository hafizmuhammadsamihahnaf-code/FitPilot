<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b24" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>
  <!-- Background with squircle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#222b37" stroke-width="8" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1d2633" stroke-width="24" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-dasharray="800" stroke-dashoffset="250" stroke-linecap="round" />

  <!-- Center Wing / Pulse Icon for FitPilot -->
  <path d="M190 280 L230 190 L270 330 L300 240 L340 280" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="12" fill="#eef2f7" />

  <!-- App Name letters -->
  <text x="256" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#eef2f7" text-anchor="middle" letter-spacing="4">FITPILOT</text>
</svg>
